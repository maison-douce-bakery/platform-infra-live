name: terraform

# PRs plan, main applies. No scheduled drift check: run it manually to check drift.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    uses: maison-douce-bakery/platform-ci-workflows/.github/workflows/terraform-static.yml@6fb526a6f532e08a00fc4131ecad00042e83c690 # terraform-static/v1.0.0
    with:
      directories: prod/ap-southeast-2/network prod/ap-southeast-2/rds prod/ap-southeast-2/ecs prod/ap-southeast-2/commerce prod/ap-southeast-2/datalake prod/ap-southeast-2/ingest-open-meteo prod/ap-southeast-2/certificate prod/ap-southeast-2/edge prod/ap-southeast-2/data-platform

  # Not on push: pending changes would be reported as drift. The apply job plans itself.
  plan:
    needs: terraform
    if: github.event_name != 'push'
    uses: maison-douce-bakery/platform-ci-workflows/.github/workflows/terraform-plan.yml@14a60ad81ce2b6807c47ecc032dd9deb6c252161 # terraform-plan/v1.0.0
    with:
      stacks: '["prod/ap-southeast-2/network", "prod/ap-southeast-2/rds", "prod/ap-southeast-2/ecs", "prod/ap-southeast-2/commerce", "prod/ap-southeast-2/datalake", "prod/ap-southeast-2/ingest-open-meteo", "prod/ap-southeast-2/certificate", "prod/ap-southeast-2/edge", "prod/ap-southeast-2/data-platform"]'
      role_arn: ${{ vars.AWS_CI_PLAN_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION }}
      backend_config: backend.hcl
    secrets:
      aws_access_key_id: ${{ secrets.AWS_CI_PLAN_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_CI_PLAN_SECRET_ACCESS_KEY }}

  apply:
    name: apply (${{ matrix.stack }})
    needs: terraform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: prod
    concurrency:
      group: apply-prod
      cancel-in-progress: false
    # max-parallel 1 runs the stacks one by one in this order: each needs the network first.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        stack: [prod/ap-southeast-2/network, prod/ap-southeast-2/rds, prod/ap-southeast-2/ecs, prod/ap-southeast-2/commerce, prod/ap-southeast-2/datalake, prod/ap-southeast-2/ingest-open-meteo, prod/ap-southeast-2/certificate, prod/ap-southeast-2/edge, prod/ap-southeast-2/data-platform]
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_CI_APPLY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_CI_APPLY_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.AWS_CI_APPLY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-apply
          role-duration-seconds: 1800

      - name: terraform apply
        working-directory: ${{ matrix.stack }}
        env:
          STACK: ${{ matrix.stack }}
        run: |
          terraform init -input=false -backend-config="$GITHUB_WORKSPACE/backend.hcl" > /dev/null

          set +e
          terraform apply -input=false -auto-approve -lock-timeout=120s -no-color > apply.txt 2>&1
          code=$?
          set -e

          # Public repo: print only the summary and errors.
          summary=$(grep -E -A3 '^(Apply complete!|No changes\.|Error:)' apply.txt || true)
          echo "$summary"
          {
            echo "### $STACK"
            echo '```'
            echo "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
